<!DOCTYPE html>
<html>
<head>
  <title>XStream Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 🔐 LOGIN SCREEN -->
<div id="loginScreen">
  <h2>🔐 XStream Login</h2>

  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">

  <button onclick="login()">Masuk</button>
  <p id="msg"></p>
</div>

<!-- 🎬 MAIN APP -->
<div id="app" style="display:none">

  <h1>📺 XStream Pro</h1>

  <input id="search" placeholder="Search media...">
  <button onclick="searchMedia()">Search</button>

  <input id="m3uUrl" placeholder="Paste M3U URL">
  <button onclick="importM3U()">Import IPTV</button>

  <div class="menu">
    <button onclick="showMovies()">🎬 Movies</button>
    <button onclick="showSeries()">📺 Series</button>
    <button onclick="showLive()">📡 Live TV</button>
  </div>

  <video id="player" controls></video>

  <div id="list"></div>

</div>

<script src="app.js"></script>
</body>
</html>
